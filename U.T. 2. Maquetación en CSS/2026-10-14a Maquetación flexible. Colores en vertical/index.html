<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        div {
            /* flex-grow: 1; */
            flex: 1 0 0;
        }

        .color-rojo {
            background-color: red;
        }

        .color-verde {
            background-color: green;
        }

        .color-azul {
            background-color: blue;
        }

        .color-amarillo {
            background-color: yellow;
        }

        .color-purpura {
            background-color: magenta;
        }
    </style>
</head>
<body>
    <div class="color-rojo">a</div>
    <div class="color-verde">a</div>
    <div class="color-azul">a</div>
    <div class="color-amarillo">a</div>
    <div class="color-purpura">a</div>
</body>
</html>
